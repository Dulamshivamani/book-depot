<!DOCTYPE html>
<html>
<head>
  <title>Space Tech</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    header {
      background: #020617;
      padding: 20px;
      font-size: 24px;
    }

    input, select, button {
      width: 90%;
      padding: 10px;
      margin: 10px;
      border-radius: 8px;
      border: none;
    }

    button {
      background: #22c55e;
      color: white;
    }

    .result {
      margin-top: 15px;
      color: #38bdf8;
    }
  </style>
</head>

<body>

<header>🚀 Space Tech Book Depot</header>

<h2>Student Details</h2>

<input type="text" id="name" placeholder="Name">
<input type="text" id="token" placeholder="Token Number">

<select id="board">
  <option value="">Board</option>
  <option>CBSE</option>
  <option>SSC</option>
</select>

<select id="class" onchange="updateFee()">
  <option value="">Class</option>
  <option value="500">Nursery - ₹500</option>
  <option value="1000">1st - ₹1000</option>
  <option value="2000">5th - ₹2000</option>
  <option value="3000">10th - ₹3000</option>
</select>

<div id="fee" class="result"></div>

<select id="payment">
  <option value="">Payment</option>
  <option value="upi">UPI</option>
  <option value="store">Pay at Store</option>
  <option value="cash">Cash</option>
</select>

<button onclick="submitForm()">Proceed</button>

<div id="result" class="result"></div>

<button onclick="downloadReceipt()">Download Receipt</button>

<button onclick="showAdmin()">Admin Panel</button>

<div id="adminData"></div>

<script>

let currentData = {};

function updateFee() {
  let fee = document.getElementById("class").value;
  document.getElementById("fee").innerHTML = "Total: ₹" + fee;
}

function submitForm() {
  let name = document.getElementById("name").value;
  let token = document.getElementById("token").value;
  let board = document.getElementById("board").value;
  let fee = document.getElementById("class").value;
  let payment = document.getElementById("payment").value;

  if(!name || !token || !board || !fee || !payment){
    alert("Fill all details");
    return;
  }

  currentData = {name, token, board, fee, payment};

  // Save locally (Admin)
  let data = JSON.parse(localStorage.getItem("orders") || "[]");
  data.push(currentData);
  localStorage.setItem("orders", JSON.stringify(data));

  document.getElementById("result").innerHTML =
    "✅ Confirmed<br>Amount: ₹" + fee;

  // UPI Payment
  if(payment === "upi"){
    let upiLink = `upi://pay?pa=yourupi@upi&pn=SpaceTech&am=${fee}&cu=INR`;
    window.location.href = upiLink;
  }
}

function downloadReceipt() {
  let text = `
Receipt
-------
Name: ${currentData.name}
Token: ${currentData.token}
Board: ${currentData.board}
Amount: ₹${currentData.fee}
Payment: ${currentData.payment}
`;

  let blob = new Blob([text], { type: "text/plain" });
  let link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "receipt.txt";
  link.click();
}

function showAdmin() {
  let password = prompt("Enter Admin Password");

  if(password !== "1234"){
    alert("Wrong Password");
    return;
  }

  let data = JSON.parse(localStorage.getItem("orders") || "[]");

  let output = "<h3>All Orders</h3>";

  data.forEach(d => {
    output += `Name: ${d.name} | ₹${d.fee}<br>`;
  });

  document.getElementById("adminData").innerHTML = output;
}

</script>

</body>
</html>
