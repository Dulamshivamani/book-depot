<!DOCTYPE html>
<html>
<head>
  <title>STL Learning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      margin: 0;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #0f172a, #6d28d9);
    }

    header {
      padding: 20px;
      font-size: 26px;
      font-weight: bold;
    }

    .container {
      padding: 20px;
    }

    input, select, button {
      width: 90%;
      padding: 12px;
      margin: 10px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button {
      background: #22c55e;
      color: white;
      font-weight: bold;
    }

    .result {
      margin-top: 20px;
      font-size: 18px;
      color: #38bdf8;
    }
  </style>
</head>

<body>

<header>🚀 STL Learning</header>

<div class="container">

<input type="text" id="name" placeholder="Name">
<input type="text" id="token" placeholder="Token Number">

<select id="board" onchange="resetFee()">
  <option value="">Select Board</option>
  <option value="cbse">CBSE</option>
  <option value="ssc">SSC</option>
</select>

<select id="class" onchange="updateFee()">
  <option value="">Select Class</option>
  <option value="2964">Nursery</option>
  <option value="3749">LKG</option>
  <option value="3926">UKG</option>
  <option value="5560">Grade 1</option>
  <option value="5631">Grade 2</option>
  <option value="6282">Grade 3</option>
  <option value="6527">Grade 4</option>
  <option value="6567">Grade 5</option>
  <option value="6475">Grade 6</option>
  <option value="6825">Grade 7</option>
  <option value="6990">Grade 8</option>
  <option value="6725">Grade 9</option>
</select>

<div id="fee" class="result"></div>

<select id="payment">
  <option value="">Payment Method</option>
  <option value="upi">UPI</option>
  <option value="store">Pay at Store</option>
  <option value="cash">Cash</option>
</select>

<button onclick="processPayment()">Proceed</button>

<div id="result" class="result"></div>

</div>

<script>

let currentFee = 0;

function resetFee(){
  document.getElementById("fee").innerHTML = "";
}

function updateFee(){
  let board = document.getElementById("board").value;
  let selected = document.getElementById("class");

  if(board === "cbse"){
    currentFee = selected.value;
    document.getElementById("fee").innerHTML = "Amount: ₹" + currentFee;
  } else {
    currentFee = 0;
    document.getElementById("fee").innerHTML = "⚠️ SSC prices are different";
  }
}

function generateID(){
  return "STL" + Math.floor(100000 + Math.random() * 900000);
}

function processPayment(){
  let name = document.getElementById("name").value;
  let token = document.getElementById("token").value;
  let board = document.getElementById("board").value;
  let payment = document.getElementById("payment").value;

  if(!name || !token || !board || !currentFee || !payment){
    alert("Please fill all details");
    return;
  }

  let paymentID = generateID();

  if(payment === "upi"){
    let upi = `upi://pay?p=9440081394-5@ybl&pn=STL&am=${currentFee}&cu=INR`;
    window.location.href = upi;
  }

  document.getElementById("result").innerHTML =
    "✅ Payment Successful<br>" +
    "ID: " + paymentID + "<br>" +
    "Amount: ₹" + currentFee + "<br><br>" +
    "🙏 Thank you, visit again!";
}

</script>

</body>
</html>
